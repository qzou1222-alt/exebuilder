[project]
name = "exebuilder"
version = "0.2.0"
authors = [
  { name="Victor Zou" }
]
description = "A simple EXE builder for Python files."
readme = "ReadMe.md"
requires-python = ">=3.10"

dependencies = [
  "pyinstaller"
]